# ==================================================
# Site settings
# ==================================================
title: "먼로그"
logo: "/assets/images/logo.gif"
favicon_ico: "/assets/images/favicon.ico"
description: "개인 학습 및 기술 정리"
baseurl: ""
url: "https://sheon-j.github.io"
permalink: pretty
# ==================================================
# Theme
# ==================================================
remote_theme: just-the-docs/just-the-docs
color_scheme: dark
# ==================================================
# Defaults
# ==================================================
defaults:
  - scope:
      path: "docs"
      type: "pages"
    values:
      layout: "default"
# ==================================================
# Navigation / UI
# ==================================================
search_enabled: false
show_last_edit_time: true
last_edit_time_format: "%Y-%m-%d"
aux_links:
  "깃허브":
    - "https://github.com/sheon-j"
aux_links_new_tab: true
# ==================================================
# Markdown
# ==================================================
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
mermaid:
  version: "9.1.3"
# ==================================================
# Plugins (GitHub Pages 호환)
# ==================================================
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
# ==================================================
# SEO
# ==================================================
lang: ko-KR
timezone: Asia/Seoul
# ==================================================
# Exclude
# ==================================================
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
